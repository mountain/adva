proof_or_certificate = "docs/research/0193-the-optimal-shares-and-the-price-of-a-level.md records the run; experiments/traversal_allocation_optimal/evidence.json retains it. The layer costs telescope: reaching a depth costs (d+1)^2 steps, checked at every depth first computed, which bounds the depth a pool can buy by a square root and keeps the optimisation small. Inside a fixed pool and ceiling the greedy rule that always raises the shallowest side matches the exhaustive optimum in all 36 declared cases, and the depth spread of the optimum is never more than one, being zero in 23 cases and one in 13: so the direction's equal thirds are the level case of that rule and are optimal exactly where the pool affords the same depth everywhere, with the mechanism that a layer's marginal mass halves while its marginal step cost grows, leaving the shallowest side both the largest gain and the smallest cost. Resolving happens in whole layers, so optimal splits leave steps unspent and those steps are reported. Over fifteen declared cases, five join cost models at three budgets, the direction's one per cent reserve is optimal in exactly one: a constant one-step join cost at a budget of ten thousand, where the optimum is 1/100 and the direction sits on a plateau. In the other fourteen the optimal reserve lies between two and thirty per cent, and the starkest case is a join cost of ten plus one per level at a budget of one thousand, where one per cent buys level zero and the gap in remaining mass is 98299/196608, that is one half of the space never resolved. Three errors remain on the record: the expectation that the optimal side depths would be equal everywhere was refuted by the run and replaced by the measured spread, the exhaustive search first ran to a ceiling the reserve could push to the horizon and broke the assertion budget until the ceiling was bounded by the pool, and several type slips between Fractions and strings were caught by the runtime before reaching the record.