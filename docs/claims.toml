proof_or_certificate = "docs/research/0202-does-a-step-close-more-than-it-opens.md records the run; experiments/aperture_ledger/evidence.json retains it. In the scanner currency the line closes more than it opens: the exact-only count rose from five to thirteen while the deciding count rose by one, so the strict net over the line is seven, and exactly one step opened more than it closed, namely the round that put two float probes on an acceptance path on purpose. Because an illustration-only experiment is still an aperture that decides nothing, the run reports a strict net and a loose net of seven and three and names the four steps where they disagree, so how much an opening is worth is itself a declaration. In the mass currency a resolving step closes a layer and opens nothing while a truncating step opens a residual inside the cut ideal whose mass is of the same order as the layer it closes, giving a net of zero, and two levels change nothing at all because no accepted cylinder has those lengths. In the statement currency the net is exactly zero, because each correction appended to a note closes a statement while the sentence a later recomputation refuted stays in the frozen evidence by design, so that currency has a structural floor that correcting notes cannot pass. The instrument also turned out to be inside what it measures: this round is itself an experiment in the inventory it counts and was classed exact-only, so the series includes it and its last point is a fixed point rather than a reading, while a round whose own verdict were deciding would open a count by measuring it. Four slips remain on the record: the sign convention was first read backwards and no check or test caught it because both readings gave non-empty lists, the currency first counted two verdicts instead of four and produced steps with no net change, and the retained inventory records the exact-only steps as numeric deltas while the deciding step appears only in prose, so part of the series