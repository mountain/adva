dual inside the ideal of positive-degree terms, and against the exact carrier it is unequal at the content level and at the object level while the inequality is detectable; at order 1 the exact pair has 3 monomials against 2 for the truncated carrier. Three refusal controls are recorded: division by the zero polynomial, a negative exponent, and an inverse without a non-zero constant term. Three errors from this round remain on the record: the first exponent was labelled lucky before the threshold was derived, a comparison against an unnormalised image made a scalar difference look like a failure at the degenerate base and was corrected, and the test's reader of a displayed polynomial first read 1x as a constant, the third occurrence of that transposition in this repository. 5409 assertions, 0.03 seconds, reproduced byte for byte on a fresh run."
counterexample_boundary = "Everything here is inside two variables and one declared family. The negative result about inversion is a proof about Q[x,y], because the origin evaluation settles it, while the search beside it is only a bounded negative and is never a proof of nonexistence. Injectivity of the substitution is sound for equality testing on the declared degree bounds only, and the agreement of the substituted divisor with the image of the true divisor at the tested exponents is a measurement on the declared pair rather than a guarantee. One unlucky modular cell shows that injectivity is not the same condition as a lucky image; it is not a theorem about how often an image is unlucky. No canonical representative is selected: this rung uses an equivalence relation and implements no monic representative, no monomial order and no Groebner basis, so whether a canonical form is needed at all remains undecided. No rational reconstruction, formula reconstruction or CRT assembly is implemented. The composed measurement covers three declared orders on one declared denominator and shows that a truncated carrier's inequality with the exact carrier is detectable; it does not recover anything about truncation, and identifiability remains unsatisfied except by retaining the unexpanded remainder. Nothing here decides the degree or ideal budget a real carrier would need, the finite form of a terminal collapse condition, or whether a refusal counts as a shell. The duality between the historical method's single-remainder step and the source-to-projection witness remains an interpretation and not an isomorphism, and this rung's negative results do not change that boundary. Native status is NotRun: no native change is made and none is proposed, no library entry and no Seal follows, and every opening in the float aperture inventory remains open for the other experiments."
