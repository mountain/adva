owth, the hypothesis that the empty chain field came from copying the wrong directory was refuted when copying the whole root left the field empty, and an earlier version of the optimal-reserve section used a float square root in a run whose purpose was measurement, which was replaced by an integer square root. 108 assertions, reproduced on a fresh run with the declared host fields excluded."
