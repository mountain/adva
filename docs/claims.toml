ree worlds still has nineteen models of which one satisfies the conclusion, and four countermodels are retained, the smallest being three worlds with the relation holding for zero to zero, zero to one, one to one and two to two, which is reflexive and transitive and not symmetric, with godlike worlds one and two. Over the symmetric frames exactly sixty-four subsets force the conclusion, namely those containing the axiom that necessary existence is positive, and each leaves exactly one model, so the smallest forcing set is a single axiom and it forces by collapsing the model class to a point rather than by deriving anything. Adding the converse of the first axiom is neither free nor fatal: it moves the symmetric class at three worlds from one thousand eight hundred thirty-two models to seventy-seven and from two hundred seventy-eight conclusions to five. Over the three axioms of negation, entailment and necessary existence there are eighty-six models, spread over ten of the twelve declared frame-class and world-count blocks and contributing none in the universal frame at two and three worlds, and in all eighty-six the conclusion holds exactly when every property has the same extension at every world that a world sees, so in the declared semantics the conclusion and the collapse of the modality are the same condition; only fifty of the eighty-six also satisfy the remaining four axioms. The single symmetric model those three axioms leave is the frame in which no world sees another, with positivity at each world exactly the set of non-empty properties the individual has there, so positivity carries no information in it. The declared family contains no identity predicate, so uniqueness is not expressible and is recorded as an untested residual. With one world all one hundred twenty-eight subsets force the conclusion, the empty set of axioms included, so the degenerate case is evidence for nothing. RLIMIT_CPU, RLIMIT_FSIZE and the wall alarm are installed and no address-space ceiling is installed because no child process is launched."
