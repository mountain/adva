assumptions = ["Every object is declared in contract.json; no corpus is opened and no corpus count and no external measurement is imported, reproduced or recomputed. The six head names with their head numbers and addresses, the four named addresses, the six histogram boxes with their multiplicities, the two named pairs, the four documents of the counting unit and the two pairs of the similarity witness are declared, and the two prose sentences the input document quotes verbatim are attributed to named commits of the project author's own public record at https://github.com/mountain/wenyan-relation-learning", "A pairing of the address space is read as an operation x to x plus v, and the order of every such shift is computed rather than assumed", "The capacity bounds range over every allocation of six binary places to four ternary places, in both directions, with and without the requirement that every ternary place be read, and the one-bit-per-place image is constructed over all sixty-four words rather than taken from the identity two to the fourth", "The carry profiles are obtained by iterating every step of each odometer and are matched against a closed form", "The percentile comparison is made under an independence assumption that the arithmetic itself refutes, so no significance is claimed", "Python integers, tuples, Fraction and unicodedata are the whole implementation; every acceptance test compares integers or exact rationals"]
dependencies = []
proof_or_certificate = "experiments/four_trit_address/evidence.json retains the frozen run: 136 assertions in six sections, all passing in under a tenth of a second. Exactly one shift of the four-place ternary address has order at most two, namely the identity; there is no shift of order exactly two; all eighty nonzero shifts have order three, are fixed-point-free, and give twenty-seven three-cycles each; and twice a nonzero ternary shift never vanishes. The six-place binary space is the opposite case: sixty-three nonzero shifts of order two and the identity. A pairing of eighty-one heads has at most forty pairs and an odd number of fixed points, and four of the five externally reported pair counts, sixty-nine, one hundred twenty-six, one hundred thirty-one and one hundred thirty-three, exceed that bound. The six declared head names have their address index and their tetragram codepoint recomputed from the declared addresses and compared with the declared gloss, and the two named pairs' differences are recomputed from the declared addresses: the pair 窮 and 毅 lands in the dominant declared box, two two two zero, while the pair 釋 and 積 has difference two one one zero, which is not one of the six declared boxes, and the six boxes add to sixty pairs. Both dominant differences of the externally reported histogram have order three. Reading eighty-one heads into sixty-four words forces a largest fibre of at least two by counting, at least four placewise with every place read, and at least three if a place may be ignored. Reading the sixty-four words into four ternary places reaches at most thirty-six coordinate-wise with the allocation two, two, one, one, and sixteen with one bit per place, the last being constructed over all sixty-four words and counted rather than written as an identity, while an unconstrained injection reaches all sixty-four and is not coordinate-wise; an explicit base-three injection is exhibited and checked for injectivity; and the information-optimal binary place count is seven. The four-place ternary odometer changes one place in fifty-four of eighty-one steps, two in eighteen, three in six and four in three, matching the closed form, and the six-place binary odometer changes one place in thirty-two of sixty-four. Four declared step relations give four distinct single-place shares: one, one half, two thirds and three quarters. The mean percentile of one hundred twenty-six extracted pairs is twenty-nine five-hundredths below the median, which is under 2.26 independent-pair standard errors, while a head appears twenty-eight ninths times on average so the pairs are not disjoint. A passage-level count of a title-level structure is independent of the number of titles: the count is taken over declared passages, and two control documents carrying the same restating passages with the title counts swapped give the same two counts. The role orderings of a frame are enumerated rather than counted by a formula, so a one-role frame is shown to admit exactly one. A declared similarity witness of one opposite pair and one unrelated pair, with different attribute sets and different sizes, returns the same low score of one quarter under the declared Jaccard measure, so that field is the negated result of a comparison; the general statement that no similarity measure can separate opposition from unrelatedness is a declared observation illustrated by that instance and is not proved here. RLIMIT_CPU, RLIMIT_FSIZE and the wall alarm are installed and no address-space ceiling is installed because no child process is launched."
counterexample_boundary = "No text is opened as a corpus and no corpus count is imported; the addresses, coordinates, head names, histogram boxes and counts are declared numbers in the contract and only their arithmetic consistency is checked, while the two prose sentences the input document quotes verbatim are attributed to named commits of the project author's own public record. What is ruled out is a pairing by coordinate shift only: some other involution on the address space is not excluded, and none is constructed. The theorem is that differences cannot be its invariant, not that any pairing is arbitrary. The carry profile is a fingerprint and not a collation, and no claim is made that any transmitted order has been verified or matches it. The capacity bounds bound a placewise or a coordinate-wise reading, and no claim is made that any correspondence intends either kind. The declared addresses and head names are used only to check the stated arithmetic of the address formula and of the reported differences; no chapter is read and no meaning is claimed, and the rendering of a tetragram gloss as a Chinese head name is a declared gloss that no arithmetic checks. No statistical significance is claimed for the percentile comparison, and no claim is made that a similarity measure is invalid in general: the statement is that it cannot separate opposition from unrelatedness, and what is computed is one declared instance of that, the general statement being a declared observation rather than a theorem. The documents behind the counting-unit identity are declared and not measured, so the count's independence of the title count is a property of the declared model. The address space and its shifts are not claimed as native structures, and no SourceId, observer, aperture, clock, operation or Seal is created. Every acceptance test compares integers or exact rationals."
