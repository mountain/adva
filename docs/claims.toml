scope = "One Rust-validated finite acyclic adva.ir version 1 diagram and two downward-closed node sets U contained in V; optional revalidated compiler GraftTrace provenance"
assumptions = ["Rust diagram validation is authoritative", "Both endpoints are causal pasts of the same unchanged diagram", "Operation-node dependency is the causal order", "Imported diagrams may lack graft provenance"]
dependencies = ["adva.exact.diagram-validation.v1", "adva.exact.causal-cut-analysis.v1", "adva.exact.compiler-graft-trace.v1"]
proof_or_certificate = "ProgramSliceCertificate checks diagram integrity, both past closures, inclusion, the exact V-minus-U event difference, lower/upper boundary partitions, through-wire identity, internal-event retention, original node and occurrence identities, lineage, node-associated history, and optional graft-frame intersections; Rust tests cover identity, explicit copy, identical frontier snapshots around constant--discard history, rejected nonnested pasts, nonempty graft intersections, and a zero-event call frame"
counterexample_boundary = "Equal cut frontiers do not identify an empty interval. A zero-operation identity call has a graft frame but no nonempty event-region intersection, so WP2 supplies no total frame-to-slice map. Adjacent-slice composition, associativity, imported graft reconstruction, local binders, recursion, dual grids, pullback, P-star, and expression-level PSP-star factorization remain outside this claim"
forbidden_conflations = ["Cut frontier with program interval", "Equal frontier snapshot with equal history", "Internal event with upper-boundary output", "Graft intersection with event partition", "Empty-node frame with canonical causal interval", "Identity-preserving view with recompiled diagram", "Optional graft link with imported provenance", "ProgramSlice with observer pullback", "Exact interval with PSP-star theorem"]

[[claim]]
claim_id = "adva.exact.program-slice-composition.v1"
canonical_name = "Exact composition of adjacent same-diagram program slices"
code_symbol = "adva_ir::{ProgramSliceCompositionArtifact, ProgramSliceCompositionCertificate}; adva_lisp::{compose_program_slices, compose_program_slices_with_graft}"
dimension = "causal-open/same-diagram/exact-composition"
status = "exact"
scope = "Two canonical adjacent ProgramSlice views of one Rust-validated finite acyclic diagram, with optional provenance from the same revalidated compiler GraftTrace"
assumptions = ["Both input slices are rederived exactly from one unchanged diagram", "The upper cut of the left slice equals the lower cut of the right slice", "Input event sets are disjoint", "Graft-linked inputs supply their original trace"]
dependencies = ["adva.exact.program-slice-analysis.v1", "adva.exact.compiler-graft-trace.v1"]
proof_or_certificate = "ProgramSliceCompositionCertificate checks diagram integrity, exact input revalidation, literal middle-boundary agreement, disjoint event partition, equality of the event union with the outer past difference, preservation of original identities and lineage, and full equality with the directly analyzed outer slice; Rust tests cover hidden constant--discard history, exact three-segment associativity, left/right identity slices, and rederived graft intersections"
counterexample_boundary = "Composition is same-diagram only and returns an identity-preserving view, not a materialized standalone program. It does not identify equal frontiers, concatenate event order, reconstruct imported graft provenance, compose across diagrams, provide arbitrary graph gluing, define a dual grid or observer pullback, or establish P-star or PSP-star factorization"
forbidden_conflations = ["Event-vector concatenation with canonical diagram order", "Adjacent boundary lists with outer boundary partition", "Equal frontier with empty composite", "Direct equality with numerical equivalence", "Same-diagram composition with cross-program transport", "Identity slice with erased through wire", "Graft-linked composition with implicit provenance", "Exact associativity with CoherenceCell", "ProgramSlice composition with P-star"]
