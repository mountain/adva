proof_or_certificate = "docs/research/0192-the-traversal-allocation-and-its-reserve.md records the run; experiments/traversal_allocation_and_reserve/evidence.json retains it. The allocation 33/100, 33/100, 33/100 and 1/100 closes exactly in hundredths. In binary64 the ordinary closure test passes, 3*0.33 + 0.01 equals one, while the parts are not exact: the defect in exact rationals is -27/2^59, negative, so the float route over-allocates, and three copies of one third close by rounding in the same way with an exact defect of 1/2^54. The inexactness becomes visible at the step level and it starves the reserve rather than the sides: at a budget of ten the exact rule funds the reserve with one step and per-part rounding funds it with zero, because the reserve is the smallest share and is the one rounding eats, while the exact rule is never below the declared one percent at any tested budget. The reserve buys joins, so its sufficiency is a critical level: under a constant join cost it is unbounded and therefore not a depth bound at all, under one step per level it reaches level nine, under ten plus one per level it reaches level zero and buys no join whatsoever, and under a doubling cost it reaches level three. The traversal walks a real sha256 anchor chain and joins levels one through three under the doubling cost, refusing from level four, which agrees with the critical level computed independently from the reserve; every failed join leaves the chain head and the resolved level unchanged, so the rollback is free exactly while the reserve belongs to no side, and carving it out of a side costs that side the failed join's two steps out of thirty-three. Three errors remain on the record: the expectation that the binary64 closure test would fail was backwards, since it passes by rounding; the function first named layer_mass returned the remaining mass and was renamed; and the first carve comparison mixed steps with fractions, which exact arithmetic could not catch because Fraction is dimensionless. 75 assertions, reproduced byte for byte on a fresh run with the single declared host field excluded."
