scope = "Thirty-eight isomorphism classes of A2-quiver representations over F_2 and F_3 with total dimension at most four, the strongest piece-level key (per graded piece its dimension pair, its slope and its complete isomorphism type), eleven exact rational parameters, 456 Harder-Narasimhan filtrations, and Ext^1 computed for the nine ordered pairs of indecomposables with dimensions at most (2,2); 15643 assertions, no floating-point value in any acceptance test"
assumptions = ["For an A2 representation the triple (dim V1, dim V2, rank of the arrow) is the isomorphism class, so a key recording a graded piece's dimension pair and its own arrow rank is already the complete piece-level key", "A graded piece F_i / F_(i-1) has dimensions (dim U1_i - dim U1_(i-1), dim U2_i - dim U2_(i-1)) and arrow rank dim(phi(U1_i) + U2_(i-1)) - dim U2_(i-1)", "Every object of a fixed dimension vector has the same slope, because the slope is a function of the dimension vector alone", "Ext^1(M,N) classifies isomorphism classes of middle terms of 0 -> N -> E -> M -> 0, and is enumerated here by brute force over the finite field without assuming any formula", "The hereditary Euler form of the A2 quiver with its single arrow 1 -> 2 is <m,n> = m1 n1 + m2 n2 - m1 n2", "dim Ext^1 = dim Hom - <dim M, dim N> is a checked agreement between two routes in this model, not a derivation", "The parameter sweep is a declared finite grid of eleven parameters", "F_p exactness is not rational or complex exactness"]
dependencies = ["adva.bounded-experiment.hns-object-forgetting.v0"]
proof_or_certificate = "docs/research/0169-arakelov-stability-monge-ampere-mirror-ladder.md section 8 records the test; experiments/hns_extension_residual/evidence.json retains the result. The strongest piece-level key collides 60 times across the two fields, the same count and the same 137 distinct shadows per field as the sibling run, checked at run time against experiments/hns_object_forgetting/evidence.json pinned by sha256 09280cf0cd5e3bdd17b32200f0d7121d1bbe31a8eafec6a4f4b85912fd59d550. The witness: over F_2 at theta = (0,1) the classes (1,1,0) and (1,1,1) have graded pieces [(0,1) slope 1 rank 0] then [(1,0) slope 0 rank 0] in both cases, that is the same two objects S2 then S1 in the same order, and the objects are not isomorphic, so no function of the pieces separates them. Ext^1 is computed by two independent routes that agree on all nine ordered pairs of indecomposables over both fields; exactly one pair is non-zero, quotient S1 and subobject S2, with dim Hom 0, Euler pairing -1, dim Ext^1 1, and middle terms exactly (1,1,0) and (1,1,1), so the witness pair is the split and the non-split extension of the same pieces; the reversed ordering has dim Ext^1 0 and only the split middle term. Every collision found is the whole isomorphism-class set of one dimension vector and its size is min(d1,d2)+1, the number of possible gluing ranks, and at the semistable parameter (1,1) the filtration is trivial so the weakest key hides all min(d1,d2)+1 classes while the strongest key separates them. 38 objects, 456 filtrations, 15643 assertions, 0.74 seconds, reproduced byte for byte on a fresh run."
counterexample_boundary = "A2 is hereditary and of finite representation type with exactly three indecomposables, so Ext^2 vanishes here, every extension is assembled from one-dimensional Ext^1 between simples, and the single non-split class up to isomorphism follows from a one-dimensional Ext^1 over a finite field rather than from a general theorem. Nothing is claimed in characteristic zero, for coherent sheaves, for Higgs bundles, for an arithmetic base, or for any non-hereditary or higher-extension phenomenon. Over C the middle terms of a non-split extension are not a finite set and min(d1,d2)+1 has no counterpart in this form. Ext^1 is verified by enumeration only for the nine ordered pairs with dimensions at most (2,2) over F_2 and F_3. The assertion that no per-piece key can separate the witness holds because the pieces agree as objects, and it says nothing about whether a key using data outside the pieces could separate other collision families. Whether an extension class is the right invariant when the pieces themselves deform is not tested. No metric, Kaehler class, curvature, partial differential equation, Arakelov object, mirror construction or Calabi-Yau statement is introduced. No native Rust witness, no library admission and no Seal follows."
forbidden_conflations = ["A forgotten rank with a merely omitted coordinate", "An extension class in a finite hereditary model with an extension class in a surface, a Higgs bundle or any category where the pieces themselves deform", "A collision surviving the strongest piece-level key with the impossibility of any separating invariant whatsoever", "A one-dimensional Ext^1 over a finite field with a one-dimensional Ext^1 in general", "The graded shadow with the object", "Ext^1 with a canonical representative of the extension", "This bounded experiment with native admission or a Seal"]

[[claim]]
claim_id = "adva.bounded-experiment.density-wave-marginal-wall.v0"
canonical_name = "In the local tight-winding density-wave relation the marginal locus is a discriminant, the unstable band is bounded with an edge product independent of self-gravity, and the term that makes it a density wave is certifiably not a polynomial symbol"
code_symbol = "experiments/density_wave_marginal_wall/calibration.py; experiments/density_wave_marginal_wall/contract.json; docs/research/0170-density-wave-marginal-wall-and-the-nonlocality-of-self-gravity.md"
dimension = "external exact rational arithmetic plus a declared quadratic-surd field / local dispersion relation imported from the literature / one declared finite parameter grid"
status = "bounded-experiment"
scope = "The local tight-winding relation (omega - m Omega)^2 = kappa^2 - g|k| + c_s^2 k^2 over declared exact positive rationals, 91 quadratic rows including the exact marginal row g = 2 kappa c_s for every declared (kappa, c_s), 9 band groups, 7 interpolation degrees, a power-law rotation family with five exponents, the flat rotation curve with exact sqrt(2) at four azimuthal numbers, 27 two-sided-window rows and 91 tunnelling rows; 2533 assertions, no floating-point value in any acceptance test"
assumptions = ["The tight-winding dispersion relation of Lin and Shu is imported and is not derived, verified or justified here", "The self-gravity coefficient is a declared rational g standing for 2 pi G Sigma; that identification is imported and neither G nor pi appears in any computation", "kappa is the epicyclic frequency and kappa^2 = r d(Omega^2)/dr + 4 Omega^2 is taken as given for a declared rotation curve", "The pattern rotates rigidly at one pattern speed, so the frequency at azimuthal number m is omega = m Omega_p", "Propagating and evanescent wavenumbers are read only from the local pressure-supported relation, with no global connection problem and no reflection or transmission coefficient", "Differentiating a Laurent monomial is the power rule by definition, so the power-law family checks exponent bookkeeping and the coefficient identity and not the existence of the derivative"]
dependencies = []
proof_or_certificate = "docs/research/0170-density-wave-marginal-wall-and-the-nonlocality-of-self-gravity.md records the calibration; experiments/density_wave_marginal_wall/evidence.json retains the result. On k >= 0 the relation is the quadratic c_s^2 k^2 - g k + kappa^2 with discriminant (g - 2 kappa c_s)(g + 2 kappa c_s); the sign of its minimum, the sign of Q - 1 and the sign of minus the discriminant are computed independently and agree on all 91 rows, so the marginal locus is a zero of a discriminant, and the nine exact marginal rows have minimum exactly zero with the double root at kappa/c_s. When unstable the two roots are strictly positive, so the unstable set is a bounded band; its edges satisfy k1 + k2 = g/c_s^2 and k1 k2 = kappa^2/c_s^2, and grouping band rows by (kappa, c_s) gives one product per group across every self-gravity coefficient, so the geometry of the band is set by rotation and sound speed while existence and width are set by self-gravity. Dropping the modulus leaves kappa^2 + c_s^2 k^2 with minimum kappa^2 > 0 on every row, and replacing the modulus by its square leaves a quadratic whose instability, when present, has no upper edge; only the modulus gives a band bounded at both ends. No polynomial agrees with the modulus on a two-sided neighbourhood: matching it at n+1 distinct positive rational nodes determines a unique polynomial of degree at most n, and for every n from 0 to 6 that polynomial is exactly k, with value -3 at -3 where the modulus is 3. For the flat rotation curve kappa = sqrt(2) Omega and the frequency relation vanishes exactly at r_cr(1 - sqrt(2)/m) and r_cr(1 + sqrt(2)/m), computed in Q(sqrt 2); corotation is their exact midpoint for every m, the inner radius exists exactly when m^2 > 2, and the sign of the relation over a declared rational grid is positive outside and negative between, which is the evanescent band. Inside the band a real wavenumber needs g >= 2 c_s c with c^2 the barrier depth, the same discriminant in the opposite direction, so g is confined to the window 2 c_s c <= g <= 2 kappa c_s: 18 of 27 rows open, 6 closing, 3 empty. At corotation the matter term equals the frequency, the barrier depth is exactly kappa^2 established by squaring the epicyclic frequency, and the lower threshold becomes 2 c_s kappa, which is the local stability wall, so the window closes at the Toomre value. 2533 assertions, 0.04 seconds, reproduced byte for byte on a fresh run."
counterexample_boundary = "No galaxy is modelled, no global mode is constructed, no growth rate or pattern speed is computed, and no structure is claimed to be stable for a long time. The dispersion relation and the identification g = 2 pi G Sigma are imported and nothing about them is verified or compared against data. The nonlocality certificate covers constant-coefficient polynomial symbols only; a nonlocal scalar completion is not excluded and is the correct reading. The power-law family does not verify the existence of any derivative. The two-sided window and its closure at corotation are statements about the local relation at declared parameters and say nothing about whether a real disk satisfies them. The comparison with the finite Harder-Narasimhan wall is a comparison of shapes only: no transfer of theory, no common theorem and no identification is claimed, and the sibling evidence is read under a pinned digest and never modified. Nothing in this claim extends note 0169 or any rung of the Arakelov-stability ladder. No metric, Monge-Ampere, mirror or Calabi-Yau content. No native Rust witness, no library admission and no Seal follows."
forbidden_conflations = ["A rotational restoring tendency with an inward contraction", "The wave's outward angular-momentum transport with the cause of the pattern's persistence", "Local marginal stability with long-time stability of any structure", "A scalar density fluctuation with the mechanism of the density wave", "A local scalar wave equation with the nonlocal density wave", "The Toomre marginal wall with a stability wall of the Harder-Narasimhan type", "A wall of degeneracy with a wall of ordering", "The tight-winding local relation with the global mode problem", "An imported literature relation with a derived result", "This bounded experiment with native admission or a Seal"]
