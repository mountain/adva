canonical_name = "Whether a step closes more apertures than it opens is decidable once the currency is declared and undecidable without one: this line closes seven more than it opens in the scanner currency with one step that opened more and the round itself among the counted points, while the mass currency's truncating step and the statement currency both sit at zero for structural reasons"
