name: Pinned raw-helper native controls

on:
  pull_request:
    paths:
      - '.github/workflows/pinned-raw-helper-native-controls.yml'
      - 'experiments/native_input_binding_serialized_leaf_request/raw-helper-review-20261107/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-helper-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the existing dependency-checker requirements
        run: python -m pip install blake3==1.0.9 pytest
      - name: Receive the exact machine dependency
        run: python scripts/check_machine_dependency.py --output "$RUNNER_TEMP/machine-dependency"
        env:
          GIT_SSH_COMMAND: 'false'
          GIT_TERMINAL_PROMPT: '0'
      - name: Verify the frozen native plan and machine pin
        shell: bash
        run: |
          set -euo pipefail
          review="experiments/native_input_binding_serialized_leaf_request/raw-helper-review-20261107"
          evidence="$RUNNER_TEMP/pinned-raw-helper-native-controls"
          machine="$RUNNER_TEMP/machine-dependency/dependencies/machine"
          mkdir -p "$evidence"
          test "$(git -C "$machine" rev-parse HEAD)" = a0b710a2517f06f2fe03cc463e855548adf418ac
          test -z "$(git -C "$machine" status --porcelain)"
          python -B "$review/verify.py" \
            --machine "$machine" \
            --contract-sha256 91f97bdaaa351962f9706da3dfd740dbf7b4f55fb8360780ff07f8e65cbb2752 \
            > "$evidence/reference-verification.json"
          python - <<'PY' "$review/native-plan.json" "$evidence/plan-check.json" "$review/native-execution-contract-20261108.json"
          import json, pathlib, sys
          source, target, execution_contract = map(pathlib.Path, sys.argv[1:])
          plan = json.loads(source.read_text())
          execution = json.loads(execution_contract.read_text())
          assert plan['machine_revision'] == 'a0b710a2517f06f2fe03cc463e855548adf418ac'
          assert plan['limits']['build_attempts'] == 1
          assert plan['limits']['network'] is False
          assert plan['limits']['retry'] is False
          assert execution['limits']['file_size_limit_blocks_of_512_bytes'] == 262144
          assert execution['limits']['implementation_correction_replays'] == 1
          selected = [
              'intake::tests::received_fixed_proof_checks_and_reuses_independently',
              'intake::tests::every_semantic_and_origin_dimension_is_exactly_bound',
              'intake::tests::altered_receiver_binding_cannot_authorize_itself_even_when_repinned',
          ]
          assert [row['selector'] for row in plan['tests'] if row['selector'] in selected] == selected
          target.write_text(json.dumps({'status':'PlanVerified','selectors':selected,
              'execution_contract':execution_contract.name}, indent=2)+'\n')
          PY
          rustc -vV > "$evidence/rustc.txt"
          cargo --version > "$evidence/cargo.txt"
          printf 'MACHINE=%s\nEVIDENCE=%s\n' "$machine" "$evidence" >> "$GITHUB_ENV"
      - name: Build once, offline, and resolve the test executable
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pinned-raw-helper-target"
          set +e
          (
            ulimit -v 2097152
            ulimit -f 262144
            /usr/bin/time -v -o "$EVIDENCE/build.time" \
              timeout 180 cargo test --locked --offline \
                --manifest-path "$MACHINE/experiments/native_evidence_intake/Cargo.toml" \
                --no-run --message-format=json \
                > "$EVIDENCE/build.jsonl" 2> "$EVIDENCE/build.stderr"
          )
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE/build.exit-code"
          if test "$rc" -ne 0; then
            python - <<'PY' "$EVIDENCE/result.json" "$rc"
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            'schema':'adva.pinned-raw-helper-native-controls.outcome.v1',
            'status':'Unavailable',
            'stage':'offline_build',
            'build_exit_code':int(sys.argv[2]),
            'semantic_tests_run':0,
            'network_during_build':False,
            'retry':False,
          }, indent=2)+'\n')
          PY
            echo 'BUILD_READY=0' >> "$GITHUB_ENV"
            exit 0
          fi
          python - <<'PY' "$EVIDENCE/build.jsonl" "$EVIDENCE/test-executable"
          import json, pathlib, sys
          candidates=[]
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              try: row=json.loads(line)
              except json.JSONDecodeError: continue
              if (row.get('reason')=='compiler-artifact' and row.get('executable')
                      and row.get('profile',{}).get('test')
                      and row.get('target',{}).get('name')=='adva-native-evidence-intake'):
                  candidates.append(row['executable'])
          if len(candidates) != 1:
              raise SystemExit(f'expected exactly one test executable, got {candidates!r}')
          pathlib.Path(sys.argv[2]).write_text(candidates[0]+'\n')
          PY
          sha256sum "$(cat "$EVIDENCE/test-executable")" > "$EVIDENCE/test-executable.sha256"
          echo 'BUILD_READY=1' >> "$GITHUB_ENV"
      - name: Run exactly three existing selectors
        if: env.BUILD_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          executable="$(cat "$EVIDENCE/test-executable")"
          selectors=(
            'intake::tests::received_fixed_proof_checks_and_reuses_independently'
            'intake::tests::every_semantic_and_origin_dimension_is_exactly_bound'
            'intake::tests::altered_receiver_binding_cannot_authorize_itself_even_when_repinned'
          )
          completed=0
          for index in 0 1 2; do
            selector="${selectors[$index]}"
            printf '%s\n' "$selector" > "$EVIDENCE/test-$index.selector"
            set +e
            (
              ulimit -v 2097152
              ulimit -f 262144
              /usr/bin/time -v -o "$EVIDENCE/test-$index.time" \
                timeout 10 "$executable" "$selector" --exact --nocapture --test-threads=1 \
                > "$EVIDENCE/test-$index.stdout" 2> "$EVIDENCE/test-$index.stderr"
            )
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE/test-$index.exit-code"
            completed=$((completed + 1))
            if ! test "$rc" -eq 0 \
                || ! grep -Fq 'running 1 test' "$EVIDENCE/test-$index.stdout" \
                || ! grep -Fq 'test result: ok. 1 passed; 0 failed' "$EVIDENCE/test-$index.stdout"; then
              python - <<'PY' "$EVIDENCE/result.json" "$selector" "$rc" "$completed"
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            'schema':'adva.pinned-raw-helper-native-controls.outcome.v1',
            'status':'Failed',
            'stage':'semantic_test',
            'failed_selector':sys.argv[2],
            'test_exit_code':int(sys.argv[3]),
            'semantic_tests_run':int(sys.argv[4]),
            'network_during_build_or_tests':False,
            'retry':False,
          }, indent=2)+'\n')
          PY
              exit 0
            fi
          done
          python - <<'PY' "$EVIDENCE/result.json"
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            'schema':'adva.pinned-raw-helper-native-controls.outcome.v1',
            'status':'Passed',
            'machine_revision':'a0b710a2517f06f2fe03cc463e855548adf418ac',
            'offline_build_attempts':1,
            'semantic_tests_run':3,
            'network_during_build_or_tests':False,
            'retry':False,
            'opaque_request_reads':0,
            'opaque_request_executions':0,
          }, indent=2)+'\n')
          PY
      - name: Report the bounded outcome
        if: always()
        shell: bash
        run: |
          test -s "$EVIDENCE/result.json"
          python - <<'PY' "$EVIDENCE/result.json" "$EVIDENCE"
          import json, pathlib, re, sys
          result_path, evidence = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          result = json.loads(result_path.read_text())
          measurements = {}
          for path in sorted(evidence.glob('*.time')):
              text = path.read_text()
              wall = re.search(r'Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*(\S+)', text)
              rss = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', text)
              measurements[path.stem] = {
                  'wall_clock': wall.group(1) if wall else None,
                  'max_rss_kib': int(rss.group(1)) if rss else None,
              }
          result['measured_process_costs'] = measurements
          result_path.write_text(json.dumps(result, indent=2)+'\n')
          PY
          cat "$EVIDENCE/result.json"
          for path in "$EVIDENCE"/*.time; do
            test -e "$path" || continue
            printf '\n## %s\n' "$(basename "$path")"
            cat "$path"
          done
          cat "$EVIDENCE/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-raw-helper-native-controls
          path: ${{ runner.temp }}/pinned-raw-helper-native-controls/
          if-no-files-found: error
          retention-days: 30
