name: Reversible memory and conditional Markov boundary

on:
  pull_request:
    paths:
      - 'experiments/reversible_memory/**'
      - '.github/workflows/reversible-memory.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/reversible_memory/**'
      - '.github/workflows/reversible-memory.yml'

permissions:
  contents: read

jobs:
  reversible-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check reversible gates and complete conditional histories
        run: timeout 35s python3 -B -S experiments/reversible_memory/run.py --output "$RUNNER_TEMP/reversible-memory"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversible-memory-evidence
          path: ${{ runner.temp }}/reversible-memory
