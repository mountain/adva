name: Representation residual

on:
  pull_request:
    paths:
      - "experiments/representation_residual/**"
      - "programs/representation-residual/**"
      - ".github/workflows/representation-residual.yml"

permissions:
  contents: read
  actions: read

jobs:
  finite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover the original finite run without replaying it
        if: hashFiles('docs/research/0141-representation-evidence.json') == ''
        uses: actions/download-artifact@v4
        with:
          name: representation-residual
          run-id: 34040613970
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/retained-representation
      - name: Export success and failure evidence equally
        if: hashFiles('docs/research/0141-representation-evidence.json') == ''
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root=Path('target/retained-representation/representation-residual')
          bundle={str(p.relative_to(root)):p.read_text() for p in sorted(root.rglob('*')) if p.is_file()}
          bundle['host-cost.txt']=Path('target/retained-representation/representation-host-cost.txt').read_text()
          assert 'report.json' in bundle
          print('REPRESENTATION_EVIDENCE_BEGIN')
          print(json.dumps(bundle))
          print('REPRESENTATION_EVIDENCE_END')
          PYCODE
