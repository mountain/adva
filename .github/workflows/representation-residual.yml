name: Retained representation evidence

on:
  pull_request:
    paths:
      - "experiments/representation_residual/**"
      - "programs/representation-residual/**"
      - "docs/research/0141-**"
      - ".github/workflows/representation-residual.yml"

permissions:
  contents: read

jobs:
  retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check retained bytes without replaying the finite experiment
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          summary = json.loads((root / 'docs/research/0141-representation-evidence.json').read_text())
          count = 0
          for group in ('source_sha256', 'evidence_sha256'):
              for name, expected in summary[group].items():
                  path = (root / name).resolve()
                  assert path.is_relative_to(root.resolve()), name
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
                  count += 1
          print(f'Verified {count} retained file hashes; no native experiment executed.')
          print('Recorded native comparison status:', summary['native_suite_status'])
          print('Evidence integrity does not imply numerical comparison success.')
          PYCODE
