name: Opaque consumer path continuation

on:
  pull_request:
    paths:
      - '.github/workflows/opaque-consumer-continuation.yml'
      - 'experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs'
      - 'experiments/native_input_binding_serialized_leaf_request/canonical-request-20261031.json'
      - 'experiments/native_input_binding_serialized_leaf_request/opaque-consumer-path-continuation-contract-20261101*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-case-path-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify the frozen coordinates and measure the fixture
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path

          consumer = Path("experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs")
          fixture = Path("experiments/native_input_binding_serialized_leaf_request/canonical-request-20261031.json")
          assert hashlib.sha256(consumer.read_bytes()).hexdigest() == "ee07ea03ba1d9f451186a5e8a5eb3356da11d20faaa09e113381f958cfd4e1d3"
          started = time.perf_counter_ns()
          data = fixture.read_bytes()
          outer = json.loads(data)
          source = json.loads(outer["source_diagram_json"])
          residual = json.loads(outer["residual_diagram_json"])
          elapsed = time.perf_counter_ns() - started

          def items(value):
              if isinstance(value, dict):
                  return 1 + sum(items(child) for child in value.values())
              if isinstance(value, list):
                  return 1 + sum(items(child) for child in value)
              return 1

          measurement = {
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "outer_items": items(outer),
              "source_items": items(source),
              "residual_items": items(residual),
              "read_and_parse_ns": elapsed,
          }
          assert measurement["bytes"] == 4464
          assert measurement["sha256"] == "d4d619a621ac7fd2943daa9c6eb0757acc79023314ecf9ed7dcf2f9cb0c84d4d"
          assert measurement["outer_items"] == 21
          assert measurement["source_items"] == 59
          assert measurement["residual_items"] == 75
          print("FIXTURE_MEASUREMENT=" + json.dumps(measurement, separators=(",", ":")))
          PY
      - name: Stage only the producer-independent consumer
        run: |
          test ! -e crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
          cp experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
          cmp experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
          ! grep -Eq '^ *#\[path|^ *mod producer|receive_pinned_serialized_leaf_request' experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs
          rustfmt --edition 2024 --check experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs
      - name: Compile the unchanged independent consumer
        run: |
          if test -x /usr/bin/time; then
            /usr/bin/time -v cargo clippy --locked -p adva-lisp --test native_input_binding_serialized_consumer -- -D warnings
          else
            echo "PEAK_RSS=missing:/usr/bin/time"
            cargo clippy --locked -p adva-lisp --test native_input_binding_serialized_consumer -- -D warnings
          fi
      - name: Execute exactly the three frozen semantic cases
        run: |
          request_file="${GITHUB_WORKSPACE}/experiments/native_input_binding_serialized_leaf_request/canonical-request-20261031.json"
          test -s "${request_file}"
          for consumer_case in matching renamed-module changed-profile; do
            echo "CONSUMER_CASE=${consumer_case}"
            if test -x /usr/bin/time; then
              /usr/bin/time -v env \
                ADVA_SERIALIZED_LEAF_CONSUMER_CASE="${consumer_case}" \
                ADVA_SERIALIZED_LEAF_REQUEST_PATH="${request_file}" \
                cargo test --locked -p adva-lisp \
                  --test native_input_binding_serialized_consumer \
                  opaque_consumer_accepts_only_the_current_fixture \
                  -- --exact
            else
              echo "PEAK_RSS=missing:/usr/bin/time"
              ADVA_SERIALIZED_LEAF_CONSUMER_CASE="${consumer_case}" \
              ADVA_SERIALIZED_LEAF_REQUEST_PATH="${request_file}" \
                cargo test --locked -p adva-lisp \
                  --test native_input_binding_serialized_consumer \
                  opaque_consumer_accepts_only_the_current_fixture \
                  -- --exact
            fi
          done
