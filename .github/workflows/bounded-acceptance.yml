name: Bounded acceptance calibrations

on:
  pull_request:
    paths:
      - '.github/workflows/bounded-acceptance.yml'
      - 'experiments/native_input_binding_certificate/**'
      - 'tests/python/test_bootstrap_zero*'
      - 'docs/research/native-input-binding-certificate-v0.md'
      - 'docs/research/0102-distributivity-formation-followup.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-input-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the published research source formatting
        run: |
          rustfmt --edition 2024 --check experiments/native_input_binding_certificate/native_input_binding_certificate.rs
          rustfmt --edition 2024 --check experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs
      - name: Check the independently pinned source coordinates
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              Path('experiments/native_input_binding_certificate/native_input_binding_certificate.rs'): '096ea35d381ed281075c2b157945a5b16cee406ba2f2ff04334917a740d80e0b',
              Path('experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs'): 'bb048a76b5ff5b06c7890f4f0714ca12f68f261575606cd3ae4d05a6e15f6fbb',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (path, actual, digest)
              print(f'PINNED_SOURCE path={path} sha256={actual}')
          PY
      - name: Stage the producer and consumer as ephemeral integration tests
        run: |
          test ! -e crates/adva-lisp/tests/native_input_binding_certificate.rs
          test ! -e crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
          cp experiments/native_input_binding_certificate/native_input_binding_certificate.rs crates/adva-lisp/tests/native_input_binding_certificate.rs
          cp experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
          cmp experiments/native_input_binding_certificate/native_input_binding_certificate.rs crates/adva-lisp/tests/native_input_binding_certificate.rs
          cmp experiments/native_input_binding_certificate/native_input_binding_serialized_consumer.rs crates/adva-lisp/tests/native_input_binding_serialized_consumer.rs
      - name: Format the staged Rust source and retain its exact bytes
        run: |
          rustfmt --edition 2024 crates/adva-lisp/tests/native_input_binding_certificate.rs
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          source = Path('experiments/native_input_binding_certificate/native_input_binding_certificate.rs').read_bytes()
          staged = Path('crates/adva-lisp/tests/native_input_binding_certificate.rs').read_bytes()
          print('FORMATTED_RESEARCH_SOURCE=' + json.dumps({'source_sha256': hashlib.sha256(source).hexdigest(), 'formatted_sha256': hashlib.sha256(staged).hexdigest(), 'formatted_base64': base64.b64encode(staged).decode()}))
          PY
          cargo fmt --all --check
      - name: Check the research test with the unchanged dependency lock
        run: cargo clippy --locked -p adva-lisp --test native_input_binding_certificate --test native_input_binding_serialized_consumer -- -D warnings
      - name: Execute the certificate and existing process/graft/import regressions
        run: cargo test --locked -p adva-lisp --test native_input_binding_certificate --test process --test graft_trace --test diagram_validation
      - name: Replay the frozen request in the separately compiled consumer
        run: |
          request_file="${RUNNER_TEMP}/adva-pinned-consumer-request.json"
          ADVA_SERIALIZED_LEAF_PROCESS_ROLE=emit \
          ADVA_SERIALIZED_LEAF_REQUEST_PATH="${request_file}" \
            cargo test --locked -p adva-lisp \
              --test native_input_binding_certificate \
              serialized_leaf_request_replays_across_processes_only_for_matching_identity \
              -- --exact
          test -s "${request_file}"
          REQUEST_FILE="${request_file}" python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path

          data = Path(os.environ["REQUEST_FILE"]).read_bytes()
          print("OPAQUE_FIXTURE=" + json.dumps({
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "base64": base64.b64encode(data).decode(),
          }, separators=(",", ":")))
          PY
          for consumer_case in matching renamed-module changed-profile; do
            ADVA_SERIALIZED_LEAF_CONSUMER_CASE="${consumer_case}" \
            ADVA_SERIALIZED_LEAF_REQUEST_PATH="${request_file}" \
              cargo test --locked -p adva-lisp \
                --test native_input_binding_serialized_consumer \
                separately_compiled_consumer_receives_only_matching_request \
                -- --exact
          done

  whole-cut-formation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated check tools
        run: python -m pip install pytest==8.4.2 ruff==0.13.0
      - name: Check modified Python research sources
        run: |
          ruff check tests/python/test_bootstrap_zero_whole_cut_grammar.py tests/python/test_bootstrap_zero_distributivity_record.py
          ruff format --check tests/python/test_bootstrap_zero_whole_cut_grammar.py tests/python/test_bootstrap_zero_distributivity_record.py
      - name: Replay all Bootstrap Zero syntax modules
        run: python -m pytest -q tests/python/test_bootstrap_zero*.py -p no:cacheprovider
