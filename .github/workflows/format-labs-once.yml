name: One-shot format LABS experiment

on:
  push:
    branches:
      - research/0050-bounded-triadic-labs-search

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatting
        run: |
          if git diff --quiet -- experiments/labs-search/src/lib.rs experiments/labs-search/src/main.rs; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/labs-search/src/lib.rs experiments/labs-search/src/main.rs
          git commit -m "style: format bounded LABS experiment"
          git push origin "HEAD:${GITHUB_REF_NAME}"
