name: Decision ledger contention

on:
  pull_request:
    paths:
      - 'experiments/decision_ledger_contention/**'
      - 'experiments/decision_ledger/**'
      - 'experiments/decision_checkpoint/**'
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-ledger-contention.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/decision_ledger_contention/**'
      - 'experiments/decision_ledger/**'
      - 'experiments/decision_checkpoint/**'
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-ledger-contention.yml'

permissions:
  contents: read

jobs:
  ledger-contention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded overlapping submissions and storage classification
        run: timeout 35s python3 -B -S experiments/decision_ledger_contention/run.py --output "$RUNNER_TEMP/decision-ledger-contention"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-ledger-contention-evidence
          path: ${{ runner.temp }}/decision-ledger-contention
