name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Run first bounded M6 reveal
        run: |
          cargo run -p adva-witness --bin adva -- \
            reveal programs/bootstrap-0/reveal.adva \
            --fuel 6 \
            --output target/first-reveal-witness.adva \
            --print
          cmp \
            target/first-reveal-witness.adva \
            programs/bootstrap-0/first-reveal-witness.adva
      - name: Run first three-sided trace arithmetic calibration
        run: |
          cargo run -p adva-witness --bin adva -- \
            trace-arithmetic programs/bootstrap-0/first-reveal-witness.adva \
            --output target/first-trace-arithmetic.adva \
            --print

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: pytest
