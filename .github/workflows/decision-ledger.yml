name: Decision continuation ledger

on:
  pull_request:
    paths:
      - 'experiments/decision_ledger/**'
      - 'experiments/decision_checkpoint/**'
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/decision_ledger/**'
      - 'experiments/decision_checkpoint/**'
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-ledger.yml'

permissions:
  contents: read

jobs:
  continuation-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded ledger replay and commit-boundary exits
        run: timeout 35s python3 -B -S experiments/decision_ledger/run.py --output "$RUNNER_TEMP/decision-ledger"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-ledger-evidence
          path: ${{ runner.temp }}/decision-ledger
