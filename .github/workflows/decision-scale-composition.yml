name: Decision scale composition

on:
  pull_request:
    paths:
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-scale-composition.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/decision_scale_composition/**'
      - 'experiments/decision_scale/**'
      - 'experiments/finite_decision/**'
      - 'experiments/probability_receipt/receive.py'
      - 'experiments/probability_receipt/run.py'
      - '.github/workflows/decision-scale-composition.yml'

permissions:
  contents: read

jobs:
  scale-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify two ordered scale transports and the intermediate boundary
        run: timeout 35s python3 -B -S experiments/decision_scale_composition/run.py --output "$RUNNER_TEMP/decision-scale-composition"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-scale-composition-evidence
          path: ${{ runner.temp }}/decision-scale-composition
