[workspace]
members = [
    "crates/adva-ir",
    "crates/adva-lisp",
    "crates/adva-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Adva contributors"]
repository = "https://github.com/mountain/adva"

[workspace.dependencies]
adva-ir = { path = "crates/adva-ir" }
adva-lisp = { path = "crates/adva-lisp" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
