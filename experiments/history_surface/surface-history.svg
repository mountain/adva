<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
<title>Changing boundary, recoverable history</title>
<desc>Three sampling-site diagrams show an old history, its extension and one corrupted sample. The old history remains reconstructible.</desc>
<rect width="1200" height="650" rx="18" fill="#f4f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#20344b}.title{font-size:29px;font-weight:bold}.sub{font-size:15px;fill:#526478}.panel{font-size:20px;font-weight:bold}.value{font-size:21px;font-weight:bold}.site{font-size:12px;fill:#526478}.word{font-size:23px;font-weight:bold}</style>
<text x="35" y="46" class="title" text-anchor="start">Changing boundary, recoverable history</text>
<text x="35" y="75" class="sub" text-anchor="start">Exact arithmetic over F7. Sampling sites illustrate a code, not a geometric duality.</text>
<rect x="25" y="105" width="370" height="380" rx="14" fill="white" stroke="#d8e1ec"/>
<text x="210" y="145" class="panel" text-anchor="middle">Before</text>
<circle cx="210" cy="290" r="88" fill="none" stroke="#ccd8e7" stroke-width="2"/>
<circle cx="210.00" cy="202.00" r="23" fill="#ecf3fa" stroke="#3468ac" stroke-width="2"/>
<text x="210.00" y="209.00" class="value" text-anchor="middle">2</text>
<text x="210.00" y="169.00" class="site" text-anchor="middle">s=1</text>
<circle cx="293.69" cy="262.81" r="23" fill="#ecf3fa" stroke="#3468ac" stroke-width="2"/>
<text x="293.69" y="269.81" class="value" text-anchor="middle">5</text>
<text x="328.88" y="255.37" class="site" text-anchor="middle">s=2</text>
<circle cx="261.73" cy="361.19" r="23" fill="#ecf3fa" stroke="#3468ac" stroke-width="2"/>
<text x="261.73" y="368.19" class="value" text-anchor="middle">3</text>
<text x="283.47" y="395.13" class="site" text-anchor="middle">s=3</text>
<circle cx="158.27" cy="361.19" r="23" fill="#ecf3fa" stroke="#3468ac" stroke-width="2"/>
<text x="158.27" y="368.19" class="value" text-anchor="middle">3</text>
<text x="136.53" y="395.13" class="site" text-anchor="middle">s=4</text>
<circle cx="126.31" cy="262.81" r="23" fill="#ecf3fa" stroke="#3468ac" stroke-width="2"/>
<text x="126.31" y="269.81" class="value" text-anchor="middle">5</text>
<text x="91.12" y="255.37" class="site" text-anchor="middle">s=5</text>
<text x="210" y="287" class="sub" text-anchor="middle">5 samples</text>
<text x="210" y="310" class="sub" text-anchor="middle">3 history symbols</text>
<text x="210" y="443" class="sub" text-anchor="middle">Decoded history</text>
<text x="210" y="473" class="word" text-anchor="middle" style="fill:#3468ac">[1, 0, 1]</text>
<rect x="415" y="105" width="370" height="380" rx="14" fill="white" stroke="#d8e1ec"/>
<text x="600" y="145" class="panel" text-anchor="middle">After appending 1</text>
<circle cx="600" cy="290" r="88" fill="none" stroke="#ccd8e7" stroke-width="2"/>
<circle cx="600.00" cy="202.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="600.00" y="209.00" class="value" text-anchor="middle">3</text>
<text x="600.00" y="169.00" class="site" text-anchor="middle">s=1</text>
<circle cx="676.21" cy="246.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="676.21" y="253.00" class="value" text-anchor="middle">6</text>
<text x="708.25" y="231.50" class="site" text-anchor="middle">s=2</text>
<circle cx="676.21" cy="334.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="676.21" y="341.00" class="value" text-anchor="middle">2</text>
<text x="708.25" y="356.50" class="site" text-anchor="middle">s=3</text>
<circle cx="600.00" cy="378.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="600.00" y="385.00" class="value" text-anchor="middle">4</text>
<text x="600.00" y="419.00" class="site" text-anchor="middle">s=4</text>
<circle cx="523.79" cy="334.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="523.79" y="341.00" class="value" text-anchor="middle">4</text>
<text x="491.75" y="356.50" class="site" text-anchor="middle">s=5</text>
<circle cx="523.79" cy="246.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="523.79" y="253.00" class="value" text-anchor="middle">1</text>
<text x="491.75" y="231.50" class="site" text-anchor="middle">s=6</text>
<text x="600" y="287" class="sub" text-anchor="middle">6 samples</text>
<text x="600" y="310" class="sub" text-anchor="middle">4 history symbols</text>
<text x="600" y="443" class="sub" text-anchor="middle">Decoded history</text>
<text x="600" y="473" class="word" text-anchor="middle" style="fill:#278164">[1, 0, 1, 1]</text>
<rect x="805" y="105" width="370" height="380" rx="14" fill="white" stroke="#d8e1ec"/>
<text x="990" y="145" class="panel" text-anchor="middle">After one sample fault</text>
<circle cx="990" cy="290" r="88" fill="none" stroke="#ccd8e7" stroke-width="2"/>
<circle cx="990.00" cy="202.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="990.00" y="209.00" class="value" text-anchor="middle">3</text>
<text x="990.00" y="169.00" class="site" text-anchor="middle">s=1</text>
<circle cx="1066.21" cy="246.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="1066.21" y="253.00" class="value" text-anchor="middle">6</text>
<text x="1098.25" y="231.50" class="site" text-anchor="middle">s=2</text>
<circle cx="1066.21" cy="334.00" r="23" fill="#ffe5e5" stroke="#c4494b" stroke-width="2"/>
<text x="1066.21" y="341.00" class="value" text-anchor="middle">3</text>
<text x="1098.25" y="356.50" class="site" text-anchor="middle">s=3</text>
<circle cx="990.00" cy="378.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="990.00" y="385.00" class="value" text-anchor="middle">4</text>
<text x="990.00" y="419.00" class="site" text-anchor="middle">s=4</text>
<circle cx="913.79" cy="334.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="913.79" y="341.00" class="value" text-anchor="middle">4</text>
<text x="881.75" y="356.50" class="site" text-anchor="middle">s=5</text>
<circle cx="913.79" cy="246.00" r="23" fill="#ecf3fa" stroke="#278164" stroke-width="2"/>
<text x="913.79" y="253.00" class="value" text-anchor="middle">1</text>
<text x="881.75" y="231.50" class="site" text-anchor="middle">s=6</text>
<text x="990" y="287" class="sub" text-anchor="middle">6 samples</text>
<text x="990" y="310" class="sub" text-anchor="middle">4 history symbols</text>
<text x="990" y="443" class="sub" text-anchor="middle">Decoded history</text>
<text x="990" y="473" class="word" text-anchor="middle" style="fill:#278164">[1, 0, 1, 1]</text>
<rect x="25" y="510" width="1150" height="88" rx="12" fill="#e3eee9"/>
<text x="600" y="545" class="word" text-anchor="middle">Old-history readback at every stage: [1, 0, 1]</text>
<text x="600" y="574" class="sub" text-anchor="middle">Every old sample changes on extension. One substituted value is corrected.</text>
<text x="25" y="627" class="sub" text-anchor="start">Assumptions: intact header and the stated fault bound. Decoding alone does not establish authenticity.</text>
</svg>
